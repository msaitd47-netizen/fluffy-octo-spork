<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ant Feast">
<meta name="theme-color" content="#f0c08c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<title>Ant Feast</title>
<style>
:root{
  --wood1:#f3c793; --wood2:#eebb83; --ink:#4a3540; --panel:#f6e3d3;
  --slot:#fffaf5; --accent:#ffcf3d; --accent-d:#e0a412; --purple:#7a5cc9; --purple-d:#5a3fa3;
  --pink:#ff7aa8; --good:#4cc36a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);
  background:var(--wood1);
  background-image:repeating-linear-gradient(90deg,var(--wood1) 0 46px,var(--wood2) 46px 48px,var(--wood1) 48px 92px,#f0c088 92px 93px);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px)}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home{justify-content:center;gap:18px;text-align:center}
.logo{font-weight:700;font-size:44px;line-height:.95;color:#fff;letter-spacing:.5px;
  text-shadow:0 3px 0 #c9542c,0 6px 0 #a43f1e,0 10px 14px rgba(80,30,10,.35);
  margin:0}
.logo small{display:block;font-size:30px;color:#ffd84a}
.mascot{width:150px;height:150px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.big-btn{min-width:230px;padding:16px 26px;border-radius:22px;font-size:26px;font-weight:700;color:#5a3a00;
  background:linear-gradient(#ffe36b,var(--accent));box-shadow:0 6px 0 var(--accent-d),0 10px 18px rgba(90,50,0,.25);
  transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-d)}
.big-btn small{display:block;font-size:15px;font-weight:600;opacity:.75}
.soft-btn{padding:11px 20px;border-radius:16px;font-size:17px;font-weight:600;background:#fff6ec;
  box-shadow:0 4px 0 #d9a978;color:var(--ink)}
.soft-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a978}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- GAME ---------- */
.topbar{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;height:44px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff;font-size:20px;
  box-shadow:0 3px 0 var(--purple-d);display:grid;place-items:center}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--purple-d)}
.pill{background:rgba(110,70,40,.18);padding:6px 16px;border-radius:14px;font-weight:700;font-size:18px;color:#5b3b26}
.coins{background:#fff6dc;border-radius:16px;padding:7px 14px;font-weight:700;font-size:17px;color:#7a4b00;box-shadow:0 3px 0 #e2b45a;min-width:74px;text-align:center}
.coins.bump{animation:pop .4s}
.boost b{position:relative}
.boost em{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ff5f8f;color:#fff;
  font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 0 #c9406a}
.boost em.price{background:#ffcf3d;color:#6b4300;box-shadow:0 2px 0 #d39b12;font-size:11px}
.boost.re b{background:radial-gradient(circle at 35% 30%,#ffd3a8,#e39a5a);box-shadow:0 4px 0 #b86f34}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}
.swatches .jar{width:100%;height:auto;aspect-ratio:1/1.08;cursor:pointer}
.swatches .jar .bd span{font-size:16px}
.fastpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:#4a3540;color:#ffd84a;
  padding:6px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;display:none}
.fastpill.on{display:block;animation:pop .3s}
.board-card{margin-top:6px;background:var(--panel);border-radius:18px;padding:10px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 6px 0 #d8ab7f,0 12px 22px rgba(90,50,20,.22);
  display:grid;place-items:center}
#board{display:block}
.progress{width:100%;max-width:300px;height:10px;border-radius:6px;background:rgba(110,70,40,.2);margin:12px 0 6px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a4d,#ff5f8f);border-radius:6px;transition:width .2s}
.queue{display:flex;gap:7px;margin:8px 0 12px}
.slot{width:var(--js);height:calc(var(--js)*1.08);border-radius:14px;background:var(--slot);
  box-shadow:inset 0 -4px 0 #ecd9c6,0 3px 6px rgba(90,50,20,.15);position:relative}
.slot.extra{background:#fff2c2}
.queue.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.jars{display:flex;gap:9px;justify-content:center;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;align-items:center;position:relative}
.more{font-size:13px;font-weight:700;color:#7a5236;opacity:.8}

/* jar */
.jar{width:var(--js);height:calc(var(--js)*1.08);position:relative;--c:#e44}
.jar .lid{position:absolute;left:18%;right:18%;top:0;height:22%;border-radius:7px 7px 3px 3px;
  background:color-mix(in srgb,var(--c) 70%,#000);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.jar .bd{position:absolute;left:0;right:0;top:14%;bottom:0;border-radius:13px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 85%,#000) 100%);
  box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 65%,#000),inset 3px 3px 0 rgba(255,255,255,.35),0 3px 5px rgba(60,30,10,.25);
  display:grid;place-items:center}
.jar .bd span{font-size:calc(var(--js)*.4);font-weight:700;color:#fff;line-height:1;
  text-shadow:0 2px 0 rgba(0,0,0,.45),1px 0 0 rgba(0,0,0,.35),-1px 0 0 rgba(0,0,0,.35),0 -1px 0 rgba(0,0,0,.3)}
.jar.front{cursor:pointer;animation:pop .25s}
.jar.front:active{transform:scale(.92)}
.jar.back{filter:saturate(.55) brightness(.92);opacity:.6}
.jar.hidden .bd{background:repeating-linear-gradient(45deg,#8a6ad6 0 6px,#7a5cc9 6px 12px);box-shadow:inset 0 -5px 0 #523a96,0 3px 5px rgba(60,30,10,.25)}
.jar.hidden .lid{background:#523a96}
.jar.hidden .bd span{font-size:calc(var(--js)*.45)}
.slot .jar{position:absolute;inset:0;width:auto;height:auto}
.jar .chain{position:absolute;right:-6px;top:-4px;font-style:normal;font-size:calc(var(--js)*.32);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.jars{position:relative}
.jars svg.links{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.jar.wiggle{animation:wig .5s}
@keyframes wig{20%,60%{transform:rotate(-10deg)}40%,80%{transform:rotate(10deg)}}
.col{z-index:2}
.jar.leaving{animation:leave .3s forwards}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes leave{to{transform:scale(0) rotate(20deg);opacity:0}}
.ghost{position:fixed;z-index:20;pointer-events:none;transition:transform .26s cubic-bezier(.3,.7,.3,1)}
.boosters{display:flex;gap:14px;margin-top:8px}
.boost{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#6b4630;background:none}
.boost b{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 35% 30%,#b9a2ff,var(--purple));box-shadow:0 4px 0 var(--purple-d);color:#fff}
.boost:active b{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-d)}
.boost.used{opacity:.4;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}

/* modal */
.modal{position:fixed;inset:0;background:rgba(50,25,35,.55);display:none;place-items:center;z-index:40;padding:20px}
.modal.on{display:grid}
.card{background:#fff8f0;border-radius:26px;padding:24px 22px 22px;width:min(340px,100%);text-align:center;
  box-shadow:0 8px 0 #e2b994,0 20px 40px rgba(0,0,0,.3);animation:pop .35s}
.card h2{margin:0 0 6px;font-size:30px}
.card p{margin:4px 0 14px;font-size:17px;opacity:.85}
.card canvas{margin:6px auto 14px;display:block;border-radius:12px;background:var(--panel)}
.card .big-btn{min-width:0;width:100%;font-size:22px}
.card .soft-btn{width:100%;margin-top:12px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:52vh;overflow:auto;padding:4px}
.gallery div{background:var(--panel);border-radius:12px;padding:6px;display:grid;place-items:center;aspect-ratio:1}
.gallery canvas{margin:0;max-width:100%;height:auto}
.gallery .lock{font-size:26px;opacity:.35}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:#4a3540;color:#fff;
  padding:9px 16px;border-radius:14px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Home">⌂</button>
    <div class="pill" id="lvPill">Level 1</div>
    <div class="coins" id="coinPill">🪙 0</div>
  </div>
  <div class="board-card"><canvas id="board"></canvas></div>
  <div class="progress"><i id="prog"></i></div>
  <div class="queue" id="queue"></div>
  <div class="jars" id="jars"></div>
  <div class="boosters">
    <button class="boost" id="bSlot"><b>＋<em></em></b>+1 Slot</button>
    <button class="boost" id="bMix"><b>🔀<em></em></b>Shuffle</button>
    <button class="boost" id="bUfo"><b>🛸<em></em></b>UFO</button>
    <button class="boost re" id="bRe"><b>↻</b>Restart</button>
  </div>
</section>

<canvas id="fx"></canvas>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<div class="fastpill" id="fast">⚡ Speeding up</div>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}else{r*=1+amt;g*=1+amt;b*=1+amt}
  return `rgb(${r|0},${g|0},${b|0})`}

/* parse art -> grid with auto outline */
function parseArt(def){
  const lines=def.art.replace(/^\n+|\n+$/g,'').split('\n');
  const w0=Math.max(...lines.map(l=>l.length)), h0=lines.length;
  const W=w0+2,H=h0+2, g=[];
  const ok=ch=>ch&&ch!=='.'&&(ch==='K'||def.pal[ch]);
  for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++){
    const ch=(lines[y-1]||'')[x-1];g[y].push(ok(ch)?ch:null)}}
  const out=g.map(r=>r.slice());
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(g[y][x])continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if((g[y+dy]||[])[x+dx])out[y][x]='K'}}
  const pal=Object.assign({K:OUTLINE},def.pal);
  return {W,H,g:out,pal};
}

/* level config incl. difficulty tier */
function levelConfig(n){
  const L=LEVELS.length, base=LEVELS[n%L], tier=Math.floor(n/L), k=n%L;
  const art=parseArt(base);
  let px=0;art.g.forEach(r=>r.forEach(c=>{if(c)px++}));
  const jarsWanted=Math.min(64,(n<3?6:12)+k*0.45+tier*8);
  const avg=Math.max(4,Math.min(28,px/jarsWanted));
  return {n,name:base.name,art,
    min:Math.max(3,Math.round(avg*0.6)), max:Math.max(5,Math.round(avg*1.4)),
    hidden: n<2?0:Math.min(.5,.1+k*0.005+.12*tier),
    links: n<4?0:Math.min(8,1+Math.floor((k-4)/9)+tier*2),
    cols: n<3?3:4, Q:5};
}

/* build pixels + jars; ensure greedy-solvable */
function buildLevel(cfg){
  const {W,H,g}=cfg.art; const pixels=[]; const idx=[];
  for(let y=0;y<H;y++){idx.push([]);for(let x=0;x<W;x++){
    if(g[y][x]){idx[y].push(pixels.length);pixels.push({x,y,c:g[y][x],s:0,t:0})}else idx[y].push(-1)}}
  const counts={}; pixels.forEach(p=>counts[p.c]=(counts[p.c]||0)+1);
  let best=null;
  for(let attempt=0;attempt<200;attempt++){
    const R=rng(cfg.n*7919+attempt*104729+11);
    const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
    let jars=[];
    for(const c in counts){let n=counts[c];
      while(n>0){let s=ri(cfg.min,cfg.max);if(n-s<cfg.min)s=n>cfg.max+cfg.min?n-cfg.min:n;s=Math.min(s,n);jars.push({c,n:s});n-=s}}
    for(let i=jars.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[jars[i],jars[j]]=[jars[j],jars[i]]}
    jars.forEach((j,i)=>{j.k=i;j.link=-1});
    const cols=Array.from({length:cfg.cols},()=>[]);
    jars.forEach((j,i)=>{const col=cols[i%cfg.cols];j.hidden=col.length>0&&R()<cfg.hidden;col.push(j)});
    // linked pairs between neighbouring columns
    let made=0;
    for(let t=0;t<200&&made<cfg.links;t++){
      const c=ri(0,cfg.cols-2), A=cols[c], B=cols[c+1];
      if(A.length<2||B.length<2)continue;
      const d=ri(1,Math.min(A.length-1,6)), d2=Math.max(0,Math.min(B.length-1,d+ri(-1,2)));
      const a=A[d],b=B[d2]; if(a.link>=0||b.link>=0||d2===0&&d===0)continue;
      a.link=b.k;b.link=a.k;a.hidden=b.hidden=false;made++;
    }
    best=cols;
    if(simulate(cols,pixels,idx,W,H,cfg.Q))break;
  }
  return {pixels,idx,cols:best};
}
function simulate(cols0,pixels,idx,W,H,Q){
  const eaten=new Uint8Array(pixels.length); let left=pixels.length;
  const cols=cols0.map(c=>c.map(j=>({c:j.c,n:j.n,k:j.k,link:j.link})));
  const empty=(x,y)=>x<0||y<0||x>=W||y>=H||idx[y][x]<0||eaten[idx[y][x]];
  const exposed=i=>{const p=pixels[i];return empty(p.x-1,p.y)||empty(p.x+1,p.y)||empty(p.x,p.y-1)||empty(p.x,p.y+1)};
  const byColor={};pixels.forEach((p,i)=>(byColor[p.c]=byColor[p.c]||[]).push(i));
  const countExp=c=>{let k=0;for(const i of byColor[c])if(!eaten[i]&&exposed(i))k++;return k};
  let queue=[];
  for(let guard=0;guard<5000;guard++){
    let prog=true;
    while(prog){prog=false;
      for(const q of queue){while(q.n>0){let f=-1;
        for(const i of byColor[q.c])if(!eaten[i]&&exposed(i)){f=i;break}
        if(f<0)break;eaten[f]=1;left--;q.n--;prog=true}}
      queue=queue.filter(q=>q.n>0)}
    if(left===0)return true;
    const free=Q-queue.length;
    if(free<=0)return false;
    let best=null,bs=-1;
    cols.forEach((c,i)=>{if(!c.length)return;const j=c[0];
      if(j.link<0){const s=countExp(j.c);if(s>bs){bs=s;best=[i]}}
      else if(free>=2){const pi=cols.findIndex(cc=>cc.length&&cc[0].k===j.link);
        if(pi>=0){const s=countExp(j.c)+countExp(cols[pi][0].c)-1;if(s>bs){bs=s;best=[i,pi]}}}});
    if(!best)return false;
    best.map(i=>cols[i][0]).forEach((j,n)=>{cols[best[n]].shift();queue.push(j)});
  }
  return false;
}

/* ---------- pixel logic ---------- */
function isEmpty(x,y){if(x<0||y<0||x>=G.W||y>=G.H)return true;const i=G.idx[y][x];return i<0||G.pixels[i].s===2}

function findTarget(c,gx){let best=null,bd=1e9;
  for(const p of G.pixels){if(p.s||p.c!==c||!exposed(p))continue;
    const d=Math.abs(p.x-gx)*0.6+(G.H-p.y)+Math.random()*1.5;if(d<bd){bd=d;best=p}}
  return best}

/* ---------- input ---------- */
$('#jars').addEventListener('pointerdown',e=>{

  const free=G.queue.filter(s=>s===null).length;

$('#bSlot').onclick=()=>{if(!G||G.over||G.usedSlot)return;if(!canAfford('slot'))return broke('slot');pay('slot');addSlot()};

function ufo(c){
  const now=performance.now(), br=board.getBoundingClientRect(), span=br.width+80;
  let removed=0;
  G.pixels.forEach(p=>{if(p.c===c&&p.s!==2){p.s=2;const px=(p.x+.5)*cell+40;p.t=now+1300*px/span;removed++}});
  G.ants=G.ants.filter(a=>a.j.c!==c);
  G.queue=G.queue.map(j=>j&&j.c===c?null:j);
  G.cols.flat().forEach(j=>{if(j.c===c&&j.link){j.link.link=null}});
  G.cols=G.cols.map(col=>col.filter(j=>j.c!==c));
  G.eaten+=removed;G.ufoAnim={t0:now};G.stuckSince=0;

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last);last=now;
  if(G&&!G.over&&!G.paused)step(now,dt);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function step(now,dt){
  const br=board.getBoundingClientRect();
  // speed up only when no jars are left in the rows
  const idle=!G.cols.some(c=>c.length);
  const target=idle?3:1; G.spd+=(target-G.spd)*Math.min(1,dt/400);
  if(idle!==G.fast){G.fast=idle;$('#fast').classList.toggle('on',idle)}
  const speed=G.spd;
  let anyTarget=false;
  G.queue.forEach((j,si)=>{
    if(!j||j.flying||!j.ready)return;
    if(now-j.ready<60)return;
    j.cool-=dt*speed;
    const sEl=document.querySelector(`#queue .slot[data-s="${si}"]`); if(!sEl)return;
    const sr=sEl.getBoundingClientRect(); const ox=sr.left+sr.width/2, oy=sr.top+sr.height*0.3;
    const gx=(ox-br.left)/cell;
    while(j.n>0&&j.cool<=0){
      const p=findTarget(j.c,gx); if(!p){j.cool=0;break}
      p.s=1; j.n--; j.inflight++; j.cool+=260;
      const tx=br.left+(p.x+.5)*cell, ty=br.top+(p.y+.5)*cell;
      const dist=Math.hypot(tx-ox,ty-oy);
      G.ants.push({x0:ox+(Math.random()-.5)*sr.width*.4,y0:oy,x1:tx,y1:ty,t0:now,k:0,dur:Math.max(700,dist/0.17),p,j,c:G.pal[j.c],ph:Math.random()*6});
    }
    if(j.n>0&&findTargetExists(j.c))anyTarget=true;
  });
  // ants
  for(let i=G.ants.length-1;i>=0;i--){const a=G.ants[i];
    a.k+=dt*speed/a.dur; const k=a.k;
    if(k>=1){a.p.s=2;a.p.t=now;a.j.inflight--;G.eaten++;sfx.pop();G.ants.splice(i,1);
      if(a.j.n===0&&a.j.inflight===0)finishJar(a.j);else updateJarNum(a.j);
      if(G.eaten===G.total){win();return}}
  }
  if(G.ants.length)updateProg();
  // lose detection
  const full=G.queue.every(s=>s);
  const busy=G.ants.length>0||G.queue.some(j=>j&&(j.flying||j.inflight>0));
  const free=G.queue.filter(s=>s===null).length;
  const canMove=G.cols.some(c=>c.length&&(c[0].link?(free>=2&&G.cols.some(d=>d[0]===c[0].link)):free>=1));
  if(!busy&&!anyTarget&&!canMove){if(!G.stuckSince)G.stuckSince=now;else if(now-G.stuckSince>700)lose()}
  else G.stuckSince=0;
}
function findTargetExists(c){for(const p of G.pixels)if(!p.s&&p.c===c&&exposed(p))return true;return false}
function finishJar(j){const si=G.queue.indexOf(j);if(si<0)return;sfx.done();
  const el=document.querySelector(`#queue .jar[data-id="${j.id}"]`);
  G.queue[si]=null;
  if(el){el.classList.add('leaving');setTimeout(()=>{if(G&&G.queue[si]===null){const s=document.querySelector(`#queue .slot[data-s="${si}"]`);if(s&&s.querySelector('.leaving'))s.innerHTML=''}},300)}
}

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawPixels(ctx,pixels,pal,cs,now,anim){
  for(const p of pixels){
    let sc=1;
    if(p.s===2){if(!anim)continue;const k=(now-p.t)/180;if(k>=1)continue;sc=k<0?1:1-k}
    const col=pal[p.c], s=cs*sc, x=p.x*cs+(cs-s)/2, y=p.y*cs+(cs-s)/2, g=Math.max(.5,cs*.06);
    ctx.fillStyle=shade(col,-.28);rr(ctx,x+g,y+g,s-g*2,s-g*2,s*.22);ctx.fill();
    ctx.fillStyle=col;rr(ctx,x+g,y+g,s-g*2,s-g*2-cs*.12,s*.22);ctx.fill();
    if(cs>=8){ctx.fillStyle='rgba(255,255,255,.35)';rr(ctx,x+g+s*.14,y+g+s*.12,s*.3,s*.18,s*.08);ctx.fill()}
  }
}
function draw(now){
  if(!G)return;
  bctx.setTransform(DPR,0,0,DPR,0,0);bctx.clearRect(0,0,G.W*cell,G.H*cell);
  drawPixels(bctx,G.pixels,G.pal,cell,now,true);
  fctx.setTransform(DPR,0,0,DPR,0,0);fctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  const sz=Math.max(5,Math.min(9,cell*.75));
  for(const a of G.ants){
    let k=Math.min(1,a.k); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const dx=a.x1-a.x0,dy=a.y1-a.y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
    const wob=Math.sin(k*Math.PI*4+a.ph)*6*Math.sin(k*Math.PI);
    const x=a.x0+dx*e+nx*wob,y=a.y0+dy*e+ny*wob, ang=Math.atan2(dy,dx);
    drawAnt(fctx,x,y,ang,sz,a.c,now+a.ph*100);
  }
  if(G.ufoAnim){const t=now-G.ufoAnim.t0;if(t>1500)G.ufoAnim=null;else drawUfo(t)}
  if(confetti.length)drawConfetti(now);
}
function drawUfo(t){
  const br=board.getBoundingClientRect(),c=fctx;
  const x=br.left-40+(br.width+80)*Math.min(1,t/1300), y=br.top-6+Math.sin(t/120)*4;
  c.save();c.globalAlpha=t>1300?1-(t-1300)/200:1;
  const g=c.createLinearGradient(0,y,0,br.bottom);g.addColorStop(0,'rgba(255,240,120,.75)');g.addColorStop(1,'rgba(255,240,120,.05)');
  c.fillStyle=g;c.beginPath();c.moveTo(x-10,y+8);c.lineTo(x+10,y+8);c.lineTo(x+cell*2.2,br.bottom);c.lineTo(x-cell*2.2,br.bottom);c.closePath();c.fill();
  c.fillStyle='#bfe9ff';c.beginPath();c.ellipse(x,y-6,14,12,0,Math.PI,0);c.fill();
  c.fillStyle='#8d97b3';c.beginPath();c.ellipse(x,y+2,34,10,0,0,7);c.fill();
  c.fillStyle='#c3cadb';c.beginPath();c.ellipse(x,y-1,30,6,0,0,7);c.fill();
  ['#ff5f8f','#ffd84a','#5bbf4a','#5aa9ff'].forEach((col,i)=>{c.fillStyle=Math.floor(t/150+i)%2?col:'#fff';c.beginPath();c.arc(x-21+i*14,y+3,3,0,7);c.fill()});
  c.restore();
}
function drawAnt(c,x,y,ang,s,col,t){
  c.save();c.translate(x,y);c.rotate(ang);
  const leg=Math.sin(t/40)*s*.25;
  c.strokeStyle=OUTLINE;c.lineWidth=Math.max(1,s*.14);c.lineCap='round';
  c.beginPath();for(const lx of [-s*.35,0,s*.35]){c.moveTo(lx,0);c.lineTo(lx+leg,-s*.7);c.moveTo(lx,0);c.lineTo(lx-leg,s*.7)}c.stroke();
  c.fillStyle=col;c.lineWidth=Math.max(1,s*.12);
  for(const [cx,r] of [[-s*.7,s*.42],[0,s*.3],[s*.6,s*.34]]){c.beginPath();c.arc(cx,0,r,0,7);c.fill();c.stroke()}
  c.restore();
}

/* ---------- confetti ---------- */
let confetti=[];
function burst(){const cols=['#ff7aa8','#ffd84a','#5bbf4a','#5aa9ff','#c48bff','#f59a3c'];
  for(let i=0;i<120;i++)confetti.push({x:window.innerWidth/2,y:window.innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,
    r:Math.random()*6,c:cols[i%cols.length],w:6+Math.random()*6,born:performance.now()})}

  fctx.setTransform(DPR,0,0,DPR,0,0);
  confetti=confetti.filter(p=>now-p.born<2600&&p.y<window.innerHeight+30);

    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fctx.restore()}

/* ---------- win / lose ---------- */
function thumb(n,maxPx){const cfg=levelConfig(n),a=cfg.art;const cs=Math.max(4,Math.floor(maxPx/Math.max(a.W,a.H)));
  const cv=document.createElement('canvas');const d=Math.min(window.devicePixelRatio||1,3);
  cv.width=a.W*cs*d;cv.height=a.H*cs*d;cv.style.width=a.W*cs+'px';cv.style.height=a.H*cs+'px';
  const c=cv.getContext('2d');c.scale(d,d);const px=[];
  for(let y=0;y<a.H;y++)for(let x=0;x<a.W;x++)if(a.g[y][x])px.push({x,y,c:a.g[y][x],s:0});
  drawPixels(c,px,a.pal,cs,0,false);return cv}
function win(){
  G.over=true;$('#fast').classList.remove('on');sfx.win();buzz([20,40,20]);burst();updateProg();
  const n=G.n;store.set('level',Math.max(store.get('level',0),n+1));
  const done=store.get('done',[]);const key=n%LEVELS.length;if(!done.includes(key)){done.push(key);store.set('done',done)}
  const reward=20+2*Math.floor(n/10);coins+=reward;saveEco();
  setTimeout(()=>{openModal(`<h2>Yum! 🐜</h2><p>The ${G.cfg.name} is all gone<br><b>+${reward} 🪙</b></p><div id="th"></div>
    <button class="big-btn" id="mNext">Next level</button><button class="soft-btn" id="mHome">Home</button>`);
    $('#th').appendChild(thumb(n,170));
    $('#mNext').onclick=()=>{closeModal();startLevel(n+1)};
    $('#mHome').onclick=()=>{closeModal();G=null;goHome()};
  },700);
}
function lose(){
  G.over=true;$('#fast').classList.remove('on');sfx.lose();buzz(80);
  const lbl=k=>inv[k]>0?`(${inv[k]} left)`:`(${PRICE[k]} 🪙)`;
  const canSlot=!G.usedSlot&&canAfford('slot'), canUfo=canAfford('ufo');
  openModal(`<h2>Stuck! 😵</h2><p>No jar can eat and no move is left.</p>
    ${canSlot?`<button class="big-btn" id="mSlot">+1 Slot ${lbl('slot')}</button>`:''}
    ${canUfo?`<button class="${canSlot?'soft-btn':'big-btn'}" id="mUfo">🛸 UFO ${lbl('ufo')}</button>`:''}
    <button class="${canSlot||canUfo?'soft-btn':'big-btn'}" id="mRetry">Try again</button>
    <button class="soft-btn" id="mHome">Home</button>`);
  if(canSlot)$('#mSlot').onclick=()=>{closeModal();G.over=false;pay('slot');addSlot()};
  if(canUfo)$('#mUfo').onclick=()=>{closeModal();G.over=false;openUfo(()=>{})};
  $('#mRetry').onclick=()=>{closeModal();startLevel(G.n)};
  $('#mHome').onclick=()=>{closeModal();G=null;goHome()};
}
function openModal(h){$('#card').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id!=='game'){fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fx.width,fx.height)}}
function goHome(){refreshEco();$('#fast').classList.remove('on');$('#playLv').textContent='Level '+(store.get('level',0)+1);$('#sndBtn').textContent=sound?'🔊 Sound on':'🔇 Sound off';show('home')}
$('#playBtn').onclick=()=>{ac();startLevel(store.get('level',0))};
$('#sndBtn').onclick=()=>{sound=!sound;store.set('sound',sound);goHome();if(sound)sfx.tap()};
$('#galBtn').onclick=()=>{
  const done=store.get('done',[]);
  openModal(`<h2>Collection</h2><p>${done.length} / ${LEVELS.length} pictures</p><div class="gallery" id="gal"></div><button class="soft-btn" id="mClose">Close</button>`);
  const gal=$('#gal');LEVELS.forEach((l,i)=>{const d=document.createElement('div');
    if(done.includes(i))d.appendChild(thumb(i,80));else d.innerHTML='<span class="lock">🔒</span>';gal.appendChild(d)});
  $('#mClose').onclick=closeModal;
};
layout();goHome();

if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
